name: landrop
description: 局域网文件互传 - 同一 Wi-Fi 下手机之间直接传输文件，不经过服务器。
publish_to: 'none'

version: 1.0.6+7

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  share_plus: ^10.1.2
  device_info_plus: ^11.1.0
  uuid: ^4.5.1
  intl: ^0.19.0
  crypto: ^3.0.6
  wakelock_plus: ^1.2.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.3.3
  gal: ^2.3.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
