name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  android:
    name: Android APK
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 若仓库配了 KEYSTORE_BASE64 / KEYSTORE_PASSWORD 两个 secret，
      # 就用固定发布签名（与本地构建的包可互相覆盖升级）；
      # 没配则回落到 debug 签名，构建照样成功。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/landrop-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=landrop\nstoreFile=landrop-release.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "已加载固定发布签名"
          else
            echo "未配置签名密钥，本次使用 debug 签名"
          fi

      - name: Build release APK
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)
          # 通用包兜底，再出分架构包：arm64 能省一半体积
          flutter build apk --release
          cd build/app/outputs/flutter-apk
          mv app-release.apk "Landrop-${VERSION}-universal.apk"
          cd -
          flutter build apk --release --split-per-abi
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk "Landrop-${VERSION}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "Landrop-${VERSION}-armeabi-v7a.apk"
          ls -lh Landrop-*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: landrop-android-apk
          path: build/app/outputs/flutter-apk/Landrop-*.apk
          if-no-files-found: error

  ios:
    name: iOS Unsigned IPA
    # iOS 只在打 tag 或手动指定时构建：推送代码时不必消耗 macOS runner
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && (github.event.inputs.target == 'all' || github.event.inputs.target == 'ios'))
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload Landrop-unsigned.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry Landrop-unsigned.ipa Payload
          ls -lh Landrop-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: landrop-ios-ipa
          path: build/ios/iphoneos/Landrop-unsigned.ipa
          if-no-files-found: error

      # 打成 tag 时：等 Android 先把 Release 建好（最多等 5 分钟），再把 ipa 挂上去
      - name: Attach IPA to release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 10); do
            if gh release upload "${GITHUB_REF_NAME}" build/ios/iphoneos/Landrop-unsigned.ipa \
                 --clobber --repo "${GITHUB_REPOSITORY}"; then
              echo "ipa 已挂到 ${GITHUB_REF_NAME}"
              exit 0
            fi
            echo "第 $i 次失败，30 秒后重试（可能 Release 还没建好）"
            sleep 30
          done
          echo "未能自动挂载，可从本次运行的 Artifacts 下载"; exit 1

  release:
    name: Publish Release
    # 只等 Android：macOS 排队可能很久，不能让 APK 跟着一起等。
    # iOS 出包后由 ios job 自己补挂到同一个 Release（见 Attach IPA）。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 已经手动建过 Release 的版本不再覆盖，避免冲掉手写的更新说明
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}")
          echo "exists=$([ "$code" = "200" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.exists == 'false'
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        if: steps.existing.outputs.exists == 'false'
        with:
          files: |
            artifacts/landrop-android-apk/*.apk
            artifacts/landrop-ios-ipa/Landrop-unsigned.ipa
          fail_on_unmatched_files: false
          generate_release_notes: true
