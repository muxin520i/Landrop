name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: '构建目标'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

jobs:
  android:
    name: Android APK
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'android'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      # 若仓库配了 KEYSTORE_BASE64 / KEYSTORE_PASSWORD 两个 secret，
      # 就用固定发布签名（与本地构建的包可互相覆盖升级）；
      # 没配则回落到 debug 签名，构建照样成功。
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/landrop-release.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=landrop\nstoreFile=landrop-release.jks\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "已加载固定发布签名"
          else
            echo "未配置签名密钥，本次使用 debug 签名"
          fi

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: landrop-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios:
    name: iOS Unsigned IPA
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.target == 'all' || github.event.inputs.target == 'ios'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf Payload Landrop-unsigned.ipa
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qry Landrop-unsigned.ipa Payload
          ls -lh Landrop-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: landrop-ios-ipa
          path: build/ios/iphoneos/Landrop-unsigned.ipa
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/landrop-android-apk/app-release.apk
            artifacts/landrop-ios-ipa/Landrop-unsigned.ipa
          generate_release_notes: true
